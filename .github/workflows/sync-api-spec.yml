name: Sync API spec

# Pulls the live public OpenAPI schema straight from the deployed FormBharo
# server (not from a file someone remembered to commit in form-bharo), so this
# repo can never show an endpoint that isn't actually live, or hide one that is.
#
# Triggered automatically by form-bharo's production deploy workflow
# (repository_dispatch), on a weekly schedule as a safety net in case a
# dispatch is ever missed, and manually via workflow_dispatch.

on:
  repository_dispatch:
    types: [sync-api-spec]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the live schema
        run: |
          curl -sf https://api.formbharo.artpark.ai/api/v1/openapi.json \
            -o api-reference/openapi.json.new
          # Match dump_openapi.py's formatting (sorted keys, trailing newline)
          # so a schema that hasn't actually changed produces no diff.
          python3 -c "
          import json
          with open('api-reference/openapi.json.new') as f:
              data = json.load(f)
          with open('api-reference/openapi.json', 'w') as f:
              json.dump(data, f, indent=2, sort_keys=True, ensure_ascii=False)
              f.write('\n')
          "
          rm api-reference/openapi.json.new

      - name: Commit and push if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- api-reference/openapi.json; then
            echo "Schema unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-reference/openapi.json
          git commit -m "Sync API schema from the live server"
          git push
          echo "Pushed the updated schema." >> "$GITHUB_STEP_SUMMARY"
