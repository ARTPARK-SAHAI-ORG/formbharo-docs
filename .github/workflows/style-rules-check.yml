name: Style rules check

# Checks every PR against the rules in CLAUDE.md and posts a pass/fail
# checklist as a PR comment. Reuses the same OAuth token as the existing
# Claude Code Review workflow.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the diff against CLAUDE.md's rules
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read CLAUDE.md in this repository. It lists numbered writing-style
            rules under "## Writing style".

            Look at every file this pull request changes (the diff for
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}).

            For each numbered rule, check whether the changed lines follow it.
            A rule that the diff doesn't touch at all (e.g. no Card was added
            or changed) counts as passing, not failing — only flag a rule the
            diff actually violates.

            Post one PR comment (gh pr comment ${{ github.event.pull_request.number }} --body-file <file>)
            containing a markdown checklist, one line per rule:
            - [x] Rule N: <short restatement> — or -
            - [ ] Rule N: <short restatement> — <file>:<line>, <one-sentence reason>

            End the comment with "X of Y rules pass." Do not add any other
            commentary before or after the checklist.
